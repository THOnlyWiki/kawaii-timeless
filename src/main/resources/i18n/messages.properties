# Kawaii-Timeless 皮肤插件（kawaii-timeless）——默认语言（中文）
# 键名与 core 的约定一致（plugin.<id>.* / skin.<id>.* / setup.<id>.*）；漏翻的键会直接显示键名

plugin.kawaii-timeless.name=Kawaii-Timeless 皮肤插件
plugin.kawaii-timeless.description=Kawaii-Timeless 皮肤插件：移植自音MAD中文维基的 Timeless 定制皮肤（布局、样式与脚本都在插件 jar 内）

skin.kawaii-timeless.name=Kawaii-Timeless
skin.kawaii-timeless.description=Kawaii-Timeless：Timeless 定制皮肤（粉色 kawaii 主题、顶栏头像下拉、左右侧栏与 Sticky 折叠导航）

# —— 界面文案（对应原皮肤 timeless-* 消息） ——
skin.kawaii-timeless.upload=上传文件
skin.kawaii-timeless.personalTitle=用户菜单
skin.kawaii-timeless.loggedinas={0}
skin.kawaii-timeless.notloggedin=未登录
skin.kawaii-timeless.userpage=用户页
skin.kawaii-timeless.talkpage=用户讨论
skin.kawaii-timeless.go=前往
skin.kawaii-timeless.navigation=导航
skin.kawaii-timeless.sitetools=wiki工具
skin.kawaii-timeless.pageactions=页面工具
skin.kawaii-timeless.userpagetools=用户页面工具
skin.kawaii-timeless.pagemisc=更多
skin.kawaii-timeless.more=更多
skin.kawaii-timeless.namespaces=命名空间
skin.kawaii-timeless.pagetools=页面操作
skin.kawaii-timeless.languages=语言
skin.kawaii-timeless.projects=其他项目
skin.kawaii-timeless.history=历史
skin.kawaii-timeless.delete=删除
skin.kawaii-timeless.pagelog=页面日志
skin.kawaii-timeless.footerCopyright=除非另有声明，本网站内容采用<a class="external" rel="nofollow" href="https://creativecommons.org/licenses/by/4.0/">Creative Commons Attribution 4.0</a>授权。
skin.kawaii-timeless.footerLicense=知识共享 署名 4.0 国际（CC BY 4.0）

# —— 站点设置分区（特殊:权限配置 → 站点设置）——
settings.kawaiiTimeless=Kawaii-Timeless 皮肤
settings.kawaiiTimelessHint=左栏站点 logo 与顶栏站名（wordmark）；也可以在 LocalSettings.yaml 里用 wikikernel.skins.kawaii-timeless.logo / wordmark 配置（写了的每次启动覆盖一次）。
settings.kawaiiTimelessLogo=左栏站点 logo 图片 URL（留空 = 不显示）
settings.kawaiiTimelessWordmark=顶栏站名：文字或图片 URL（以 / 或 http(s):// 开头按图片处理）；留空 = 站点名称
settings.kawaiiTimelessHeaderAvatar=顶栏头像图片 URL（留空 = 用用户自己的头像，未登录时用默认头像）

# —— 安装向导 ——
setup.kawaii-timeless.description=注册 Kawaii-Timeless 皮肤（布局、样式与脚本都在插件 jar 内）。
setup.kawaii-timeless.default=将 Kawaii-Timeless 设为站点默认皮肤
setup.kawaii-timeless.savedDefault=已写入：默认皮肤 \= kawaii-timeless
setup.kawaii-timeless.savedKept=已保存（保持默认皮肤）
